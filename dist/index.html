<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111514">
  <meta name="description" content="Welcome to Unpaused. Get lost in Worldloom or jump into TacticStrike. Two original games, one place to play.">
  <meta property="og:title" content="Unpaused — Find your next game">
  <meta property="og:description" content="Wander a little. Or go all in. Play Worldloom and TacticStrike on Unpaused.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Unpaused">
  <meta property="og:image" content="https://unpaused.online/hub/unpaused-social.png">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Unpaused — Find your next game</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/hub/apple-touch-icon.png">
  <link rel="preload" as="image" href="/hub/worldloom-poster.jpg" fetchpriority="high">
  <link rel="stylesheet" href="/worldloom-entry.css">
  <link rel="stylesheet" href="/account/dialog.css">
  <script type="module" crossorigin src="/assets/hub-C_PMbYeq.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/account-client-D3X58vZL.js">
  <link rel="modulepreload" crossorigin href="/assets/dialog-controller-lsJAUAzB.js">
  <link rel="stylesheet" crossorigin href="/assets/hub-B17qhsKU.css">
</head>
<body>
  <header class="masthead">
    <h1 class="brand" aria-label="Unpaused">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 5v15c0 6 4 9 9 9s9-3 9-9v-3"/><path d="m20 2 9 6-9 6z" fill="#ff6339" stroke="none"/></svg>
    </h1>
  </header>
  <button id="open-account" class="account-trigger" type="button" aria-haspopup="dialog">ACCOUNT</button>

  <main class="games" aria-label="Choose your game">
    <a id="enter-worldloom" class="game game--worldloom" href="/worldloom/" aria-labelledby="worldloom-title worldloom-action">
      <div class="game-media" aria-hidden="true">
        <img class="poster" src="/hub/worldloom-poster.jpg" alt="" fetchpriority="high" width="1800" height="2000">
        <video id="worldloom-film" class="film" autoplay muted loop playsinline preload="none" poster="/hub/worldloom-poster.jpg" tabindex="-1" disablepictureinpicture>
          <source data-src="/hub/worldloom-loop.mp4" data-small-src="/hub/worldloom-loop-mobile.mp4" type="video/mp4">
        </video>
      </div>
      <div class="game-copy">
        <h2 id="worldloom-title"><span class="sr-only">Worldloom</span><img class="game-logo" src="/hub/worldloom-logo.svg" alt="" width="580" height="232"></h2>
        <span class="enter"><span id="worldloom-action">PLAY NOW</span><span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></span></span>
      </div>
      <span class="game-divider" aria-hidden="true"></span>
    </a>

    <a id="enter-tacticstrike" class="game game--tacticstrike" href="/tacticstrike/" aria-labelledby="tacticstrike-title tacticstrike-action">
      <div class="game-media" aria-hidden="true">
        <img class="poster" src="/hub/tacticstrike-poster.jpg" alt="" width="900" height="1000" fetchpriority="high">
        <video id="tacticstrike-film" class="film" autoplay muted loop playsinline preload="none" aria-hidden="true" poster="/hub/tacticstrike-poster.jpg">
          <source data-src="/hub/tacticstrike-loop.mp4" data-small-src="/hub/tacticstrike-loop-mobile.mp4" type="video/mp4">
        </video>
      </div>
      <div class="game-copy">
        <h2 id="tacticstrike-title"><span class="sr-only">TacticStrike</span><img class="game-logo" src="/hub/tacticstrike-logo.svg" alt="" width="580" height="232"></h2>
        <span class="enter"><span id="tacticstrike-action">PLAY NOW</span><span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></span></span>
      </div>
    </a>
  </main>
  <section id="worldloom-transition" class="u-loading" role="status" aria-label="Opening Worldloom" hidden>
    <div class="u-loading__content">
      <svg class="u-loading__mark" viewBox="0 0 40 40" width="142" height="142" aria-hidden="true">
            <path d="M9 8v15c0 6 4 9 9 9s9-3 9-9v-3" fill="none" stroke="#f4f6dc" stroke-opacity=".65" stroke-width="3.4"/>
            <path class="u-loading__trail" d="M27 20v3c0 6-4 9-9 9s-9-3-9-9V8" pathLength="100" fill="none" stroke="#ff6339" stroke-width="3.4" stroke-dasharray="22 140"/>
            <path class="u-loading__runner" d="m-4.5-6 9 6-9 6z" fill="#ff6339"/>
            <path class="u-loading__rest" d="m24 5 9 6-9 6z" fill="#ff6339"/>
          </svg>
      <p class="u-loading__title">Worldloom</p>
      <p class="u-loading__message">Opening the menu.</p>
    </div>
  </section>

</body>
</html>
