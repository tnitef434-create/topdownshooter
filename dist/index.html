<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111514">
  <meta name="description" content="Welcome to Nite. Get lost in Worldloom or jump into TacticStrike. Two original games, one place to play.">
  <meta property="og:title" content="Nite — Find your next game">
  <meta property="og:description" content="Wander a little. Or go all in. Play Worldloom and TacticStrike on Nite.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://tacticstrike.nl/hub/nite-social.jpg">
  <title>Nite — Find your next game</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/hub/apple-touch-icon.png">
  <link rel="preload" as="image" href="/hub/worldloom-poster.jpg" fetchpriority="high">
  <script type="module" crossorigin src="/assets/hub-BOaxYS-N.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="/assets/hub-Qy42oO0n.css">
</head>
<body>
  <header class="masthead">
    <h1 class="brand" aria-label="Nite">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 27V5l22 22V5"/></svg>
      <span>NITE</span>
    </h1>
  </header>

  <main class="games" aria-label="Choose your game">
    <a id="enter-worldloom" class="game game--worldloom" href="/worldloom/" aria-labelledby="worldloom-title worldloom-action">
      <div class="game-media" aria-hidden="true">
        <img class="poster" src="/hub/worldloom-poster.jpg" alt="" fetchpriority="high" width="900" height="1000">
        <video id="worldloom-film" class="film" autoplay muted loop playsinline preload="none" poster="/hub/worldloom-poster.jpg" tabindex="-1" disablepictureinpicture>
          <source data-src="/hub/worldloom-loop.mp4" type="video/mp4">
        </video>
      </div>
      <div class="game-copy">
        <h2 id="worldloom-title"><span class="sr-only">Worldloom</span><img class="game-logo" src="/hub/worldloom-logo.svg" alt="" width="580" height="232"></h2>
        <span class="enter"><span id="worldloom-action">PLAY NOW</span><span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></span></span>
      </div>
    </a>

    <a id="enter-tacticstrike" class="game game--tacticstrike" href="/tacticstrike/" aria-labelledby="tacticstrike-title tacticstrike-action">
      <div class="game-media" aria-hidden="true">
        <img class="poster" src="/hub/tacticstrike-poster.jpg" alt="" width="900" height="1000" fetchpriority="high">
      </div>
      <div class="game-copy">
        <h2 id="tacticstrike-title"><span class="sr-only">TacticStrike</span><img class="game-logo" src="/hub/tacticstrike-logo.svg" alt="" width="580" height="232"></h2>
        <span class="enter"><span id="tacticstrike-action">PLAY NOW</span><span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></span></span>
      </div>
    </a>
  </main>

</body>
</html>
