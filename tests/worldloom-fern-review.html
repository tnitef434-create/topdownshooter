<!doctype html><html><meta charset="utf-8"><title>Blender fern review</title><style>body{margin:0;background:#293c37}nav{position:absolute;top:10px;left:10px}button{padding:10px}</style><nav><button id="advance">Advance wind</button><button id="static">Toggle static reference</button></nav><script type="module">
import * as THREE from '/src/public/worldloom/vendor/three.module.min.js';

import {WOODLAND_FERN} from '/src/public/worldloom/src/cave-assets.js';
